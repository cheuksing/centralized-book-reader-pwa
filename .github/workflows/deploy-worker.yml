name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Deploy
        env:
          DEPLOY_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_WORKER_ACCESS_TOKEN: ${{ secrets.WORKER_ACCESS_TOKEN }}
        run: |
          set -a
          . ./.env.defaults
          [ ! -f .env.local ] || . ./.env.local
          set +a
          export CLOUDFLARE_ACCOUNT_ID="$DEPLOY_CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_API_TOKEN="$DEPLOY_CLOUDFLARE_API_TOKEN"
          export WORKER_ACCESS_TOKEN="$DEPLOY_WORKER_ACCESS_TOKEN"
          export WORKER_ALLOWED_ORIGINS="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WORKER_ACCESS_TOKEN"
          printf %s "$WORKER_ACCESS_TOKEN" | npx --no-install wrangler secret put ACCESS_TOKEN --config worker/wrangler.toml
          npx --no-install wrangler deploy --config worker/wrangler.toml --var "ALLOWED_ORIGINS=$WORKER_ALLOWED_ORIGINS"
